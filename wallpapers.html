<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpapers Pokémon</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/pokedex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="./assets/imgs/icons/icon.png" type="image/png">
    <style>
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .wallpaper-card {
            position: relative;
            border-radius: 18px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 320px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: #fff;
        }

        .wallpaper-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
        }

        .wallpaper-card img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.3));
        }

        .wallpaper-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: rgba(255, 255, 255, 0.45);
        }
    </style>
</head>

<body>

    <!-- Injetado automaticamente pelo navbar.js -->
    <div id="navbar"></div>

    <main class="pokedex-container">
        <div class="pokedex-header">
            <h2>Galeria de avatares</h2>
            <p style="color: #666; font-size: 14px; margin-top: 5px;">Baixe ilustrações em alta resolução para seu
                dispositivo</p>
        </div>

        <div id="wallpaper-list" class="wallpaper-grid"></div>

        <div class="load-more-container">
            <button id="loadMoreWallpapers" class="btn-load-more">Carregar mais</button>
        </div>
    </main>

    <script src="./assets/js/components/navbar.js"></script>
    <script type="module" src="./assets/js/pages/wallpapers.js"></script>
</body>

</html>
