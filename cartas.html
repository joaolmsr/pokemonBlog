<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleção de Cartas TCG</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/pages/cartas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="./assets/imgs/icons/icon.png" type="image/png">
</head>

<body>

    <!-- Injetado automaticamente pelo navbar.js -->
    <div id="navbar"></div>

    <main class="cards-container">
        <div class="cards-header">
            <div class="cards-search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="cardSearch" placeholder="Buscar por nome (ex: Charizard, Mewtwo)...">
            </div>
        </div>

        <!-- Grade de cartas -->
        <div id="cards-list" class="cards-grid"></div>

        <!-- Botão de carregar mais páginas -->
        <div class="load-more-container">
            <button id="loadMoreCards" class="btn-load-more">Carregar mais cartas</button>
        </div>
    </main>

    <script src="./assets/js/components/navbar.js"></script>
    <script type="module" src="./assets/js/pages/cartas.js"></script>
</body>

</html>
