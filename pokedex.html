<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/pokedex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="./assets/imgs/icons/icon.png" type="image/png">
</head>

<body>

    <!-- Injetado automaticamente pelo navbar.js -->
    <div id="navbar"></div>

    <main class="pokedex-container">
        <div class="pokedex-header">
            <div class="pokedex-search-wrapper">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search" placeholder="Filtrar Pokémon carregado...">
            </div>
        </div>

        <div id="pokemon-list" class="pokemon-grid"></div>

        <div class="load-more-container">
            <button id="loadMore" class="btn-load-more">Carregar mais</button>
        </div>
    </main>

    <script src="./assets/js/components/navbar.js"></script>
    <script type="module" src="./assets/js/pages/pokedex.js"></script>
</body>

</html>
